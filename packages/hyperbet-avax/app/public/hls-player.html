<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HLS Player</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      body {
        font-family: system-ui, sans-serif;
      }

      video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        background: #000;
      }

      #status {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        color: #f3e4ba;
        background: linear-gradient(180deg, rgba(2, 4, 10, 0.42), rgba(2, 4, 10, 0.82));
      }

      #diagnostics {
        position: absolute;
        right: 12px;
        bottom: 12px;
        min-width: 156px;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(5, 8, 16, 0.7);
        color: #d3dae8;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        line-height: 1.4;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <video id="video" autoplay muted playsinline></video>
    <div id="status"></div>
    <div id="diagnostics"></div>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js"></script>
    <script>
      const LIVE_EDGE_CONFIG = {
        enableWorker: true,
        lowLatencyMode: true,
        liveSyncDurationCount: 2,
        liveMaxLatencyDurationCount: 4,
        liveBackBufferLength: 10,
        maxBufferLength: 6,
        maxMaxBufferLength: 12,
        maxLiveSyncPlaybackRate: 1.5,
        startFragPrefetch: true,
        manifestLoadingMaxRetry: 6,
        manifestLoadingRetryDelay: 800,
        levelLoadingMaxRetry: 6,
        levelLoadingRetryDelay: 800,
        fragLoadingMaxRetry: 6,
        fragLoadingRetryDelay: 800,
      };
      const PLAYER_DRIFT_THRESHOLD_MS = 8000;

      const params = new URLSearchParams(window.location.search);
      const streamUrl = params.get("src");
      const autoplay = params.get("autoplay") !== "0";
      const muted = params.get("muted") !== "0";
      const explicitDeliveryMode = params.get("deliveryMode");
      const video = document.getElementById("video");
      const status = document.getElementById("status");
      const diagnostics = document.getElementById("diagnostics");

      let readySent = false;
      let currentStatus = "loading";
      let stalledCount = 0;
      let rebuildCount = 0;
      let fatalErrorCount = 0;
      let recoveryCooldownUntil = 0;
      let retryTimeout = null;
      let latencyInterval = null;
      let hls = null;

      const telemetry = {
        liveEdgeLatencyMs: null,
        stallCount: 0,
        rebuildCount: 0,
        lastBufferedFragmentAt: null,
        playbackUrl: streamUrl,
        deliveryMode: explicitDeliveryMode || inferDeliveryMode(streamUrl),
      };

      function inferDeliveryMode(url) {
        if (!url) return null;
        try {
          const parsed = new URL(url);
          const protocol = (parsed.searchParams.get("protocol") || "").trim().toLowerCase();
          if (protocol === "llhls") {
            return "external_hls/llhls";
          }
          if (parsed.pathname.toLowerCase().endsWith(".m3u8")) {
            return "self_hls/hls";
          }
        } catch {
          return null;
        }
        return null;
      }

      function formatLatencyLabel(value) {
        return Number.isFinite(value) ? `${(value / 1000).toFixed(1)}s` : "n/a";
      }

      function formatBufferedLabel(value) {
        if (!Number.isFinite(value)) return "n/a";
        const ageMs = Math.max(0, Date.now() - value);
        return `${(ageMs / 1000).toFixed(1)}s ago`;
      }

      function renderDiagnostics() {
        diagnostics.innerHTML = [
          `latency ${formatLatencyLabel(telemetry.liveEdgeLatencyMs)}`,
          `stalls ${telemetry.stallCount}`,
          `rebuilds ${telemetry.rebuildCount}`,
          `buffered ${formatBufferedLabel(telemetry.lastBufferedFragmentAt)}`,
          telemetry.deliveryMode ? `mode ${telemetry.deliveryMode}` : null,
        ]
          .filter(Boolean)
          .join("<br />");
      }

      function emitStatus() {
        renderDiagnostics();
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(
              {
                type: "HLS_PLAYER_STATUS",
                ready: readySent,
                status: currentStatus,
                liveEdgeLatencyMs: telemetry.liveEdgeLatencyMs,
                stallCount: telemetry.stallCount,
                rebuildCount: telemetry.rebuildCount,
                lastBufferedFragmentAt: telemetry.lastBufferedFragmentAt,
                playbackUrl: telemetry.playbackUrl,
                deliveryMode: telemetry.deliveryMode,
              },
              window.location.origin,
            );
          }
        } catch {
          // no-op
        }
      }

      function setTelemetry(patch) {
        Object.assign(telemetry, patch);
        emitStatus();
      }

      function showStatus(message) {
        status.textContent = message;
        status.style.display = "flex";
      }

      function hideStatus() {
        status.style.display = "none";
      }

      function markReady() {
        hideStatus();
        currentStatus = "playing";
        readySent = true;
        emitStatus();
      }

      function markLoading(nextStatus = "loading") {
        hideStatus();
        currentStatus = nextStatus;
        readySent = false;
        emitStatus();
      }

      function markDegraded(message, nextStatus) {
        showStatus(message);
        currentStatus = nextStatus;
        readySent = false;
        emitStatus();
      }

      function markUnavailable(message, nextStatus = "error:unavailable") {
        showStatus(message);
        currentStatus = nextStatus;
        readySent = false;
        emitStatus();
      }

      function clearRetry() {
        if (!retryTimeout) return;
        window.clearTimeout(retryTimeout);
        retryTimeout = null;
      }

      function clearLatencyInterval() {
        if (!latencyInterval) return;
        window.clearInterval(latencyInterval);
        latencyInterval = null;
      }

      function destroyPlayer() {
        clearRetry();
        clearLatencyInterval();
        if (hls) {
          hls.destroy();
          hls = null;
        }
      }

      function readLiveEdgeLatencyMs() {
        if (hls && typeof hls.latency === "number" && Number.isFinite(hls.latency)) {
          return Math.max(0, Math.round(hls.latency * 1000));
        }
        if (!Number.isFinite(video.duration) || video.duration <= 0) {
          return null;
        }
        const remaining = video.duration - video.currentTime;
        if (!Number.isFinite(remaining) || remaining < 0) {
          return null;
        }
        return Math.round(remaining * 1000);
      }

      function syncTelemetry() {
        setTelemetry({
          liveEdgeLatencyMs: readLiveEdgeLatencyMs(),
          playbackUrl: streamUrl,
          deliveryMode: telemetry.deliveryMode || inferDeliveryMode(streamUrl),
        });
        if (
          readySent &&
          Number.isFinite(telemetry.liveEdgeLatencyMs) &&
          telemetry.liveEdgeLatencyMs > PLAYER_DRIFT_THRESHOLD_MS
        ) {
          markDegraded("Playback drifted from the live edge.", "player_drifted");
          recoverPlayback({ reloadSource: true });
        }
      }

      function startLatencyPolling() {
        clearLatencyInterval();
        latencyInterval = window.setInterval(syncTelemetry, 1000);
      }

      function recoverPlayback({
        reloadSource = false,
        recoverMedia = false,
        delayMs = 0,
      } = {}) {
        const run = () => {
          const now = Date.now();
          if (now < recoveryCooldownUntil) return;
          recoveryCooldownUntil = now + 2000;
          if (recoverMedia && hls) {
            hls.recoverMediaError();
          }
          if (reloadSource && hls) {
            hls.startLoad(-1);
          }
          syncTelemetry();
          void video.play().catch(() => {});
        };

        clearRetry();
        if (delayMs > 0) {
          retryTimeout = window.setTimeout(run, delayMs);
          return;
        }
        run();
      }

      function rebuildPlayer(reason, delayMs = 1500) {
        console.warn(`[hls-player] rebuilding: ${reason}`);
        rebuildCount += 1;
        setTelemetry({ rebuildCount });
        markDegraded("Rebuilding live stream...", "reconnecting");
        destroyPlayer();
        retryTimeout = window.setTimeout(() => {
          retryTimeout = null;
          initPlayer();
        }, delayMs);
      }

      function attachCommonVideoEvents() {
        video.addEventListener("loadedmetadata", markReady);
        video.addEventListener("loadeddata", markReady);
        video.addEventListener("canplay", markReady);
        video.addEventListener("playing", () => {
          markReady();
          syncTelemetry();
        });
        video.addEventListener("timeupdate", syncTelemetry);
        video.addEventListener("waiting", () => {
          stalledCount += 1;
          setTelemetry({ stallCount: stalledCount });
          markDegraded("Player buffering near the live edge.", "buffering");
        });
        video.addEventListener("stalled", () => {
          stalledCount += 1;
          setTelemetry({ stallCount: stalledCount });
          markDegraded("Playback drifted from the live edge.", "player_drifted");
          recoverPlayback({ reloadSource: true, delayMs: 500 });
        });
        video.addEventListener("error", () => {
          rebuildPlayer("video element error", 1000);
        });
      }

      function initPlayer() {
        destroyPlayer();
        markLoading();
        setTelemetry({
          liveEdgeLatencyMs: null,
          lastBufferedFragmentAt: null,
          playbackUrl: streamUrl,
          deliveryMode: explicitDeliveryMode || inferDeliveryMode(streamUrl),
        });

        video.muted = muted;
        video.defaultMuted = muted;
        video.autoplay = autoplay;
        if (muted) {
          video.setAttribute("muted", "");
        } else {
          video.removeAttribute("muted");
        }
        if (autoplay) {
          video.setAttribute("autoplay", "");
        } else {
          video.removeAttribute("autoplay");
        }
        video.playsInline = true;

        if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = streamUrl;
          startLatencyPolling();
          syncTelemetry();
          if (autoplay) {
            void video.play().catch(() => {});
          }
          return;
        }

        if (!window.Hls || !window.Hls.isSupported()) {
          markUnavailable(
            "HLS playback is not supported in this browser.",
            "error:hls_not_supported",
          );
          return;
        }

        hls = new window.Hls(LIVE_EDGE_CONFIG);
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        startLatencyPolling();

        hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
          markLoading("manifest_ready");
          syncTelemetry();
          if (autoplay) {
            void video.play().catch(() => {});
          }
        });

        hls.on(window.Hls.Events.FRAG_BUFFERED, () => {
          setTelemetry({ lastBufferedFragmentAt: Date.now() });
          syncTelemetry();
          markReady();
        });

        hls.on(window.Hls.Events.LEVEL_UPDATED, syncTelemetry);
        hls.on(window.Hls.Events.ERROR, (_event, data) => {
          if (!data.fatal) {
            if (
              data.details === window.Hls.ErrorDetails.BUFFER_STALLED_ERROR ||
              data.details === window.Hls.ErrorDetails.FRAG_LOAD_TIMEOUT ||
              data.details === window.Hls.ErrorDetails.LEVEL_LOAD_TIMEOUT
            ) {
              stalledCount += 1;
              setTelemetry({ stallCount: stalledCount });
              markDegraded("Playback drifted from the live edge.", "player_drifted");
              recoverPlayback({ reloadSource: true });
            } else if (
              data.details === window.Hls.ErrorDetails.BUFFER_APPEND_ERROR
            ) {
              stalledCount += 1;
              setTelemetry({ stallCount: stalledCount });
              markDegraded("Recovering live playback...", "buffering");
              recoverPlayback({ recoverMedia: true, reloadSource: true });
            }
            return;
          }

          fatalErrorCount += 1;
          if (
            data.type === window.Hls.ErrorTypes.NETWORK_ERROR &&
            fatalErrorCount < 3
          ) {
            markDegraded("Reconnecting to the live edge...", "reconnecting");
            recoverPlayback({ reloadSource: true, delayMs: 1000 });
            return;
          }

          if (
            data.type === window.Hls.ErrorTypes.MEDIA_ERROR &&
            fatalErrorCount < 3
          ) {
            markDegraded("Recovering live playback...", "buffering");
            recoverPlayback({
              recoverMedia: true,
              reloadSource: true,
              delayMs: 500,
            });
            return;
          }

          if (fatalErrorCount < 2) {
            rebuildPlayer("fatal hls error", 2000);
            return;
          }

          markUnavailable("Live stream unavailable.", "error:fatal");
        });
      }

      attachCommonVideoEvents();
      renderDiagnostics();
      markLoading();

      if (!streamUrl) {
        markUnavailable("Missing HLS stream URL.", "error:missing_stream_url");
      } else {
        initPlayer();
      }

      window.addEventListener("beforeunload", destroyPlayer);
    </script>
  </body>
</html>
