name: Deploy Hyperbet AVAX Pages

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
          - preview

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.HYPERBET_AVAX_PAGES_DEPLOY_ENABLED == 'true' || (vars.HYPERBET_AVAX_PAGES_DEPLOY_ENABLED == '' && vars.HYPERBET_AVAX_DEPLOY_ENABLED == 'true') }}
    name: Deploy hyperbet-avax pages
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging' && 'staging' || 'production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Resolve deployment target
        run: |
          deploy_target="production"
          pages_project_name="${{ vars.HYPERBET_AVAX_PAGES_PROJECT_NAME != '' && vars.HYPERBET_AVAX_PAGES_PROJECT_NAME || 'hyperbet-avax' }}"
          pages_expected_url="${{ vars.HYPERBET_AVAX_PAGES_PRODUCTION_URL }}"
          api_url="${{ vars.HYPERBET_AVAX_KEEPER_URL != '' && vars.HYPERBET_AVAX_KEEPER_URL || 'https://avax-api.hyperbet.win' }}"
          ws_url="${{ vars.HYPERBET_AVAX_KEEPER_WS_URL != '' && vars.HYPERBET_AVAX_KEEPER_WS_URL || 'wss://avax-api.hyperbet.win/ws' }}"
          avax_clob_address="${{ vars.HYPERBET_AVAX_GOLD_CLOB_ADDRESS }}"
          avax_chain_id="43114"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.environment }}" = "staging" ]; then
            deploy_target="staging"
            pages_project_name="${{ vars.HYPERBET_AVAX_PAGES_STAGING_PROJECT_NAME }}"
            pages_expected_url="${{ vars.HYPERBET_AVAX_PAGES_STAGING_URL }}"
            api_url="${{ vars.HYPERBET_AVAX_KEEPER_STAGING_URL }}"
            ws_url="${{ vars.HYPERBET_AVAX_KEEPER_STAGING_WS_URL }}"
            avax_clob_address="${{ vars.HYPERBET_AVAX_STAGING_GOLD_CLOB_ADDRESS }}"
            avax_chain_id="${{ vars.HYPERBET_AVAX_STAGING_CHAIN_ID }}"
          fi

          if [ -z "${pages_project_name}" ]; then
            echo "Missing AVAX Pages project name for ${deploy_target}" >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.environment }}" != "preview" ]; then
            if [ -z "${pages_expected_url}" ] || [ -z "${api_url}" ] || [ -z "${ws_url}" ]; then
              echo "Missing AVAX staging/prod URL configuration for ${deploy_target}" >&2
              exit 1
            fi
          fi

          if [ "${deploy_target}" = "staging" ]; then
            if [ -z "${avax_clob_address}" ] || [ -z "${avax_chain_id}" ]; then
              echo "Missing AVAX Pages staging chain configuration" >&2
              exit 1
            fi
          fi

          echo "DEPLOY_TARGET=${deploy_target}" >> "${GITHUB_ENV}"
          echo "PAGES_PROJECT_NAME=${pages_project_name}" >> "${GITHUB_ENV}"
          echo "PAGES_EXPECTED_URL=${pages_expected_url}" >> "${GITHUB_ENV}"
          echo "HYPERBET_API_URL=${api_url}" >> "${GITHUB_ENV}"
          echo "HYPERBET_WS_URL=${ws_url}" >> "${GITHUB_ENV}"
          echo "HYPERBET_AVAX_GOLD_CLOB_ADDRESS=${avax_clob_address}" >> "${GITHUB_ENV}"
          echo "HYPERBET_AVAX_CHAIN_ID=${avax_chain_id}" >> "${GITHUB_ENV}"

      - name: Configure Wrangler auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WRANGLER_CONFIG_B64: ${{ secrets.CLOUDFLARE_WRANGLER_CONFIG_B64 }}
        run: bash scripts/ci-cloudflare-auth.sh

      - name: Setup Hyperbet toolchain
        uses: ./.github/actions/setup-hyperbet

      - name: Install dependencies
        run: |
          bash scripts/ci-install-verified.sh root hyperbet-avax-app

      - name: Audit deploy env
        run: node --import tsx scripts/ci-env-audit.ts --target=app:avax --deployment=${DEPLOY_TARGET}
        env:
          VITE_GAME_API_URL: ${{ env.HYPERBET_API_URL }}
          VITE_GAME_WS_URL: ${{ env.HYPERBET_WS_URL }}
          VITE_SOLANA_CLUSTER: mainnet-beta
          VITE_USE_GAME_RPC_PROXY: "true"
          VITE_USE_GAME_EVM_RPC_PROXY: "true"
          VITE_AVAX_CHAIN_ID: ${{ env.HYPERBET_AVAX_CHAIN_ID }}
          VITE_AVAX_GOLD_CLOB_ADDRESS: ${{ env.HYPERBET_AVAX_GOLD_CLOB_ADDRESS }}

      - name: Build production app
        run: bun run --cwd packages/hyperbet-avax/app build --mode mainnet-beta
        env:
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}
          VITE_GAME_API_URL: ${{ env.HYPERBET_API_URL }}
          VITE_GAME_WS_URL: ${{ env.HYPERBET_WS_URL }}
          VITE_SOLANA_CLUSTER: mainnet-beta
          VITE_USE_GAME_RPC_PROXY: "true"
          VITE_USE_GAME_EVM_RPC_PROXY: "true"
          VITE_AVAX_CHAIN_ID: ${{ env.HYPERBET_AVAX_CHAIN_ID }}
          VITE_AVAX_GOLD_CLOB_ADDRESS: ${{ env.HYPERBET_AVAX_GOLD_CLOB_ADDRESS }}

      - name: Verify dist hygiene
        run: bash scripts/ci-pages-deploy.sh verify-dist packages/hyperbet-avax/app

      - name: Deploy to Cloudflare Pages
        env:
          INPUTS_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          bash scripts/ci-pages-deploy.sh deploy \
            packages/hyperbet-avax/app \
            "${PAGES_PROJECT_NAME}"

      - name: Resolve deployed Pages URL
        id: deployment_url
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.environment != 'preview' }}
        run: bash scripts/ci-pages-deploy.sh resolve-url \
            "${PAGES_PROJECT_NAME}" \
            "${DEPLOY_TARGET}" \
            "${GITHUB_SHA}"

      - name: Verify production build metadata
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.environment != 'preview' }}
        run: bash scripts/ci-pages-deploy.sh verify-metadata \
          "${{ steps.deployment_url.outputs.deployed_url }}" \
          "${PAGES_EXPECTED_URL}" \
          "${GITHUB_SHA}"
