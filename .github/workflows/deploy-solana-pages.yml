name: Rollback Legacy Hyperbet Solana Pages

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
          - preview
      rollback_only:
        description: "Confirm this legacy workflow is being used for rollback only"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.HYPERBET_CLOUDFLARE_ACCOUNT_ID != '' && vars.HYPERBET_CLOUDFLARE_ACCOUNT_ID || '50ad2052bbc6ca528d6993a689b419a4' }}
  HYPERBET_BSC_GOLD_CLOB_ADDRESS: ${{ vars.HYPERBET_BSC_GOLD_CLOB_ADDRESS != '' && vars.HYPERBET_BSC_GOLD_CLOB_ADDRESS || '0x443C09B1E7bb7bA3392b02500772B185654A6F33' }}
  HYPERBET_BASE_GOLD_CLOB_ADDRESS: ${{ vars.HYPERBET_BASE_GOLD_CLOB_ADDRESS != '' && vars.HYPERBET_BASE_GOLD_CLOB_ADDRESS || '0xb8c66D6895Bafd1B0027F2c0865865043064437C' }}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_only == 'true' }}
    name: Deploy hyperbet-solana pages
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging' && 'staging' || 'production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Resolve deployment target
        run: |
          deploy_target="production"
          pages_project_name="${{ vars.HYPERBET_SOLANA_PAGES_PROJECT_NAME != '' && vars.HYPERBET_SOLANA_PAGES_PROJECT_NAME || 'hyperscape-betting' }}"
          pages_expected_url="${{ vars.HYPERBET_SOLANA_PAGES_PRODUCTION_URL != '' && vars.HYPERBET_SOLANA_PAGES_PRODUCTION_URL || 'https://hyperbet.win' }}"
          api_url="${{ vars.HYPERBET_SOLANA_KEEPER_URL != '' && vars.HYPERBET_SOLANA_KEEPER_URL || 'https://api.hyperbet.win' }}"
          ws_url="${{ vars.HYPERBET_SOLANA_KEEPER_WS_URL != '' && vars.HYPERBET_SOLANA_KEEPER_WS_URL || 'wss://api.hyperbet.win/ws' }}"
          bsc_clob_address="${{ vars.HYPERBET_BSC_GOLD_CLOB_ADDRESS != '' && vars.HYPERBET_BSC_GOLD_CLOB_ADDRESS || '0x443C09B1E7bb7bA3392b02500772B185654A6F33' }}"
          base_clob_address="${{ vars.HYPERBET_BASE_GOLD_CLOB_ADDRESS != '' && vars.HYPERBET_BASE_GOLD_CLOB_ADDRESS || '0xb8c66D6895Bafd1B0027F2c0865865043064437C' }}"
          bsc_chain_id="56"
          base_chain_id="8453"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.environment }}" = "staging" ]; then
            deploy_target="staging"
            pages_project_name="${{ vars.HYPERBET_SOLANA_PAGES_STAGING_PROJECT_NAME }}"
            pages_expected_url="${{ vars.HYPERBET_SOLANA_PAGES_STAGING_URL }}"
            api_url="${{ vars.HYPERBET_SOLANA_KEEPER_STAGING_URL }}"
            ws_url="${{ vars.HYPERBET_SOLANA_KEEPER_STAGING_WS_URL }}"
            bsc_clob_address="${{ vars.HYPERBET_BSC_STAGING_GOLD_CLOB_ADDRESS }}"
            base_clob_address="${{ vars.HYPERBET_BASE_STAGING_GOLD_CLOB_ADDRESS }}"
            bsc_chain_id="${{ vars.HYPERBET_BSC_STAGING_CHAIN_ID }}"
            base_chain_id="${{ vars.HYPERBET_BASE_STAGING_CHAIN_ID }}"
          fi

          if [ -z "${pages_project_name}" ]; then
            echo "Missing Solana Pages project name for ${deploy_target}" >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.environment }}" != "preview" ]; then
            if [ -z "${pages_expected_url}" ] || [ -z "${api_url}" ] || [ -z "${ws_url}" ]; then
              echo "Missing Solana staging/prod URL configuration for ${deploy_target}" >&2
              exit 1
            fi
          fi

          if [ "${deploy_target}" = "staging" ]; then
            if [ -z "${bsc_clob_address}" ] || [ -z "${base_clob_address}" ] || [ -z "${bsc_chain_id}" ] || [ -z "${base_chain_id}" ]; then
              echo "Missing Solana Pages staging chain configuration" >&2
              exit 1
            fi
          fi

          echo "DEPLOY_TARGET=${deploy_target}" >> "${GITHUB_ENV}"
          echo "PAGES_PROJECT_NAME=${pages_project_name}" >> "${GITHUB_ENV}"
          echo "PAGES_EXPECTED_URL=${pages_expected_url}" >> "${GITHUB_ENV}"
          echo "HYPERBET_API_URL=${api_url}" >> "${GITHUB_ENV}"
          echo "HYPERBET_WS_URL=${ws_url}" >> "${GITHUB_ENV}"
          echo "HYPERBET_BSC_GOLD_CLOB_ADDRESS=${bsc_clob_address}" >> "${GITHUB_ENV}"
          echo "HYPERBET_BASE_GOLD_CLOB_ADDRESS=${base_clob_address}" >> "${GITHUB_ENV}"
          echo "HYPERBET_BSC_CHAIN_ID=${bsc_chain_id}" >> "${GITHUB_ENV}"
          echo "HYPERBET_BASE_CHAIN_ID=${base_chain_id}" >> "${GITHUB_ENV}"

      - name: Configure Wrangler auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WRANGLER_CONFIG_B64: ${{ secrets.CLOUDFLARE_WRANGLER_CONFIG_B64 }}
        run: bash scripts/ci-cloudflare-auth.sh

      - name: Setup Hyperbet toolchain
        uses: ./.github/actions/setup-hyperbet

      - name: Install dependencies
        run: |
          bash scripts/ci-install-verified.sh root hyperbet-solana-app

      - name: Audit deploy env
        run: node --import tsx scripts/ci-env-audit.ts --target=pages:legacy --deployment=${DEPLOY_TARGET}
        env:
          VITE_GAME_API_URL: ${{ env.HYPERBET_API_URL }}
          VITE_GAME_WS_URL: ${{ env.HYPERBET_WS_URL }}
          VITE_SOLANA_CLUSTER: mainnet-beta
          VITE_USE_GAME_RPC_PROXY: "true"
          VITE_USE_GAME_EVM_RPC_PROXY: "true"
          VITE_BSC_CHAIN_ID: ${{ env.HYPERBET_BSC_CHAIN_ID }}
          VITE_BSC_GOLD_CLOB_ADDRESS: ${{ env.HYPERBET_BSC_GOLD_CLOB_ADDRESS }}
          VITE_BASE_CHAIN_ID: ${{ env.HYPERBET_BASE_CHAIN_ID }}
          VITE_BASE_GOLD_CLOB_ADDRESS: ${{ env.HYPERBET_BASE_GOLD_CLOB_ADDRESS }}

      - name: Build production app
        run: bun run --cwd packages/hyperbet-solana/app build --mode mainnet-beta
        env:
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}
          VITE_GAME_API_URL: ${{ env.HYPERBET_API_URL }}
          VITE_GAME_WS_URL: ${{ env.HYPERBET_WS_URL }}
          VITE_SOLANA_CLUSTER: mainnet-beta
          VITE_USE_GAME_RPC_PROXY: "true"
          VITE_USE_GAME_EVM_RPC_PROXY: "true"
          VITE_BSC_CHAIN_ID: ${{ env.HYPERBET_BSC_CHAIN_ID }}
          VITE_BASE_CHAIN_ID: ${{ env.HYPERBET_BASE_CHAIN_ID }}
          VITE_BSC_GOLD_CLOB_ADDRESS: ${{ env.HYPERBET_BSC_GOLD_CLOB_ADDRESS }}
          VITE_BASE_GOLD_CLOB_ADDRESS: ${{ env.HYPERBET_BASE_GOLD_CLOB_ADDRESS }}

      - name: Verify dist hygiene
        run: bash scripts/ci-pages-deploy.sh verify-dist packages/hyperbet-solana/app

      - name: Deploy to Cloudflare Pages
        env:
          INPUTS_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          bash scripts/ci-pages-deploy.sh deploy \
            packages/hyperbet-solana/app \
            "${PAGES_PROJECT_NAME}"

      - name: Resolve deployed Pages URL
        id: deployment_url
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.environment != 'preview' }}
        run: bash scripts/ci-pages-deploy.sh resolve-url \
            "${PAGES_PROJECT_NAME}" \
            "${DEPLOY_TARGET}" \
            "${GITHUB_SHA}"

      - name: Verify production build metadata
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.environment != 'preview' }}
        run: bash scripts/ci-pages-deploy.sh verify-metadata \
          "${{ steps.deployment_url.outputs.deployed_url }}" \
          "${PAGES_EXPECTED_URL}" \
          "${GITHUB_SHA}"
