name: Staged Live Proof

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Proof mode"
        required: true
        default: read-only
        type: choice
        options:
          - read-only
          - canary-write
      target:
        description: "Proof target"
        required: true
        default: unified
        type: choice
        options:
          - unified
          - solana
          - bsc

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staged-live-proof:
    name: Staged Live Proof
    runs-on: ubuntu-latest
    environment: enoomian-staging
    env:
      HYPERBET_ACCEPTANCE_DEPLOYMENT: staging
      ENOOMIAN_HYPERBET_PAGES_URL: ${{ vars.ENOOMIAN_HYPERBET_PAGES_URL }}
      ENOOMIAN_HYPERBET_SOLANA_PAGES_URL: ${{ vars.ENOOMIAN_HYPERBET_SOLANA_PAGES_URL }}
      ENOOMIAN_HYPERBET_BSC_PAGES_URL: ${{ vars.ENOOMIAN_HYPERBET_BSC_PAGES_URL }}
      ENOOMIAN_HYPERBET_KEEPER_URL: ${{ vars.ENOOMIAN_HYPERBET_KEEPER_URL }}
      ENOOMIAN_HYPERBET_KEEPER_WS_URL: ${{ vars.ENOOMIAN_HYPERBET_KEEPER_WS_URL }}
      ENOOMIAN_RAILWAY_PROJECT_ID: ${{ vars.ENOOMIAN_RAILWAY_PROJECT_ID }}
      ENOOMIAN_RAILWAY_ENVIRONMENT_ID: ${{ vars.ENOOMIAN_RAILWAY_ENVIRONMENT_ID }}
      ENOOMIAN_HYPERBET_KEEPER_SERVICE_ID: ${{ vars.ENOOMIAN_HYPERBET_KEEPER_SERVICE_ID }}
      ENOOMIAN_SOLANA_RPC_URL: ${{ vars.ENOOMIAN_SOLANA_RPC_URL }}
      ENOOMIAN_SOLANA_CLUSTER: ${{ vars.ENOOMIAN_SOLANA_CLUSTER }}
      ENOOMIAN_BSC_RPC_URL: ${{ vars.ENOOMIAN_BSC_RPC_URL }}
      ENOOMIAN_BSC_CHAIN_ID: ${{ vars.ENOOMIAN_BSC_CHAIN_ID != '' && vars.ENOOMIAN_BSC_CHAIN_ID || vars.HYPERBET_BSC_STAGING_CHAIN_ID }}
      ENOOMIAN_BSC_GOLD_CLOB_ADDRESS: ${{ vars.ENOOMIAN_BSC_GOLD_CLOB_ADDRESS != '' && vars.ENOOMIAN_BSC_GOLD_CLOB_ADDRESS || vars.HYPERBET_BSC_STAGING_GOLD_CLOB_ADDRESS }}
      HYPERBET_STAGED_PROOF_DUEL_ID: ${{ vars.HYPERBET_STAGED_PROOF_DUEL_ID }}
      HYPERBET_STAGED_PROOF_DUEL_KEY: ${{ vars.HYPERBET_STAGED_PROOF_DUEL_KEY }}
      HYPERBET_SOLANA_KEEPER_STAGING_URL: ${{ vars.ENOOMIAN_HYPERBET_SOLANA_KEEPER_URL }}
      HYPERBET_SOLANA_KEEPER_STAGING_WS_URL: ${{ vars.ENOOMIAN_HYPERBET_SOLANA_KEEPER_WS_URL }}
      HYPERBET_SOLANA_STAGING_CLUSTER: ${{ vars.ENOOMIAN_SOLANA_CLUSTER }}
      HYPERBET_SOLANA_STAGING_RPC_URL: ${{ vars.ENOOMIAN_SOLANA_RPC_URL }}
      HYPERBET_SOLANA_STAGING_FIGHT_ORACLE_PROGRAM_ID: ${{ vars.HYPERBET_SOLANA_STAGING_FIGHT_ORACLE_PROGRAM_ID }}
      HYPERBET_SOLANA_STAGING_GOLD_CLOB_PROGRAM_ID: ${{ vars.HYPERBET_SOLANA_STAGING_GOLD_CLOB_PROGRAM_ID }}
      HYPERBET_SOLANA_STAGING_GOLD_AMM_PROGRAM_ID: ${{ vars.HYPERBET_SOLANA_STAGING_GOLD_AMM_PROGRAM_ID }}
      HYPERBET_SOLANA_STAGING_GOLD_PERPS_PROGRAM_ID: ${{ vars.HYPERBET_SOLANA_STAGING_GOLD_PERPS_PROGRAM_ID }}
      HYPERBET_SOLANA_STAGING_STREAM_PUBLISH_KEY: ${{ secrets.ENOOMIAN_HYPERBET_SOLANA_STREAM_PUBLISH_KEY }}
      HYPERBET_SOLANA_STAGING_ORACLE_AUTHORITY_KEYPAIR: ${{ secrets.ENOOMIAN_HYPERBET_SOLANA_ORACLE_AUTHORITY_KEYPAIR }}
      HYPERBET_SOLANA_STAGING_CANARY_KEYPAIR: ${{ secrets.ENOOMIAN_HYPERBET_SOLANA_CANARY_KEYPAIR }}
      HYPERBET_BSC_KEEPER_STAGING_URL: ${{ vars.ENOOMIAN_HYPERBET_BSC_KEEPER_URL }}
      HYPERBET_BSC_KEEPER_STAGING_WS_URL: ${{ vars.ENOOMIAN_HYPERBET_BSC_KEEPER_WS_URL }}
      HYPERBET_BSC_STAGING_RPC_URL: ${{ vars.ENOOMIAN_BSC_RPC_URL }}
      HYPERBET_BSC_STAGING_DUEL_ORACLE_ADDRESS: ${{ vars.ENOOMIAN_BSC_DUEL_ORACLE_ADDRESS }}
      HYPERBET_BSC_STAGING_GOLD_CLOB_ADDRESS: ${{ vars.ENOOMIAN_BSC_GOLD_CLOB_ADDRESS != '' && vars.ENOOMIAN_BSC_GOLD_CLOB_ADDRESS || vars.HYPERBET_BSC_STAGING_GOLD_CLOB_ADDRESS }}
      HYPERBET_BSC_STAGING_GOLD_AMM_ROUTER_ADDRESS: ${{ vars.HYPERBET_BSC_STAGING_GOLD_AMM_ROUTER_ADDRESS }}
      HYPERBET_BSC_STAGING_MUSD_TOKEN_ADDRESS: ${{ vars.HYPERBET_BSC_STAGING_MUSD_TOKEN_ADDRESS }}
      HYPERBET_BSC_STAGING_GOLD_TOKEN_ADDRESS: ${{ vars.HYPERBET_BSC_STAGING_GOLD_TOKEN_ADDRESS }}
      HYPERBET_BSC_STAGING_SKILL_ORACLE_ADDRESS: ${{ vars.HYPERBET_BSC_STAGING_SKILL_ORACLE_ADDRESS }}
      HYPERBET_BSC_STAGING_PERP_ENGINE_ADDRESS: ${{ vars.HYPERBET_BSC_STAGING_PERP_ENGINE_ADDRESS }}
      HYPERBET_BSC_STAGING_STREAM_PUBLISH_KEY: ${{ secrets.ENOOMIAN_HYPERBET_BSC_STREAM_PUBLISH_KEY }}
      HYPERBET_BSC_STAGING_REPORTER_PRIVATE_KEY: ${{ secrets.HYPERBET_BSC_STAGING_REPORTER_PRIVATE_KEY }}
      HYPERBET_BSC_STAGING_CANARY_PRIVATE_KEY: ${{ secrets.ENOOMIAN_HYPERBET_BSC_CANARY_PRIVATE_KEY }}
      HYPERBET_BSC_STAGING_ADMIN_PRIVATE_KEY: ${{ secrets.HYPERBET_BSC_STAGING_ADMIN_PRIVATE_KEY }}
      HYPERBET_BSC_STAGING_MARKET_OPERATOR_PRIVATE_KEY: ${{ secrets.HYPERBET_BSC_STAGING_MARKET_OPERATOR_PRIVATE_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Setup Hyperbet toolchain
        uses: ./.github/actions/setup-hyperbet
        with:
          install-foundry: "true"
          install-rust: "true"
          install-solana: "true"
          install-anchor: "true"

      - name: Install dependencies
        run: bash scripts/ci-install-verified.sh root

      - name: Validate staging proof target
        run: |
          if [ "${{ inputs.mode }}" = "canary-write" ] && [ "${{ inputs.target }}" = "unified" ]; then
            echo "Unified proof is read-only only; run canary writes with --target=solana or --target=bsc" >&2
            exit 1
          fi

      - name: Run staged live proof
        run: node --import tsx scripts/staged-live-proof.ts --mode=${{ inputs.mode }} --target=${{ inputs.target }}

      - name: Upload staged proof artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: staged-live-proof
          path: .ci-artifacts/staged-live-proof
          if-no-files-found: ignore
