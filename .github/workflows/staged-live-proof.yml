name: Staged Live Proof

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Proof mode"
        required: true
        default: read-only
        type: choice
        options:
          - read-only
          - canary-write
      target:
        description: "Proof target"
        required: true
        default: all
        type: choice
        options:
          - all
          - solana
          - bsc
          - avax

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staged-live-proof:
    name: Staged Live Proof
    runs-on: ubuntu-latest
    environment: staging
    env:
      HYPERBET_STAGED_PROOF_DUEL_ID: ${{ vars.HYPERBET_STAGED_PROOF_DUEL_ID }}
      HYPERBET_STAGED_PROOF_DUEL_KEY: ${{ vars.HYPERBET_STAGED_PROOF_DUEL_KEY }}
      HYPERBET_SOLANA_PAGES_STAGING_URL: ${{ vars.HYPERBET_SOLANA_PAGES_STAGING_URL }}
      HYPERBET_SOLANA_KEEPER_STAGING_URL: ${{ vars.HYPERBET_SOLANA_KEEPER_STAGING_URL }}
      HYPERBET_SOLANA_KEEPER_STAGING_WS_URL: ${{ vars.HYPERBET_SOLANA_KEEPER_STAGING_WS_URL }}
      HYPERBET_SOLANA_STAGING_CLUSTER: ${{ vars.HYPERBET_SOLANA_STAGING_CLUSTER }}
      HYPERBET_SOLANA_STAGING_RPC_URL: ${{ vars.HYPERBET_SOLANA_STAGING_RPC_URL }}
      HYPERBET_SOLANA_STAGING_FIGHT_ORACLE_PROGRAM_ID: ${{ vars.HYPERBET_SOLANA_STAGING_FIGHT_ORACLE_PROGRAM_ID }}
      HYPERBET_SOLANA_STAGING_GOLD_CLOB_PROGRAM_ID: ${{ vars.HYPERBET_SOLANA_STAGING_GOLD_CLOB_PROGRAM_ID }}
      HYPERBET_SOLANA_STAGING_GOLD_AMM_PROGRAM_ID: ${{ vars.HYPERBET_SOLANA_STAGING_GOLD_AMM_PROGRAM_ID }}
      HYPERBET_SOLANA_STAGING_GOLD_PERPS_PROGRAM_ID: ${{ vars.HYPERBET_SOLANA_STAGING_GOLD_PERPS_PROGRAM_ID }}
      HYPERBET_SOLANA_STAGING_STREAM_PUBLISH_KEY: ${{ secrets.HYPERBET_SOLANA_STAGING_STREAM_PUBLISH_KEY }}
      HYPERBET_SOLANA_STAGING_ORACLE_AUTHORITY_KEYPAIR: ${{ secrets.HYPERBET_SOLANA_STAGING_ORACLE_AUTHORITY_KEYPAIR }}
      HYPERBET_SOLANA_STAGING_CANARY_KEYPAIR: ${{ secrets.HYPERBET_SOLANA_STAGING_CANARY_KEYPAIR }}
      HYPERBET_BSC_PAGES_STAGING_URL: ${{ vars.HYPERBET_BSC_PAGES_STAGING_URL }}
      HYPERBET_BSC_KEEPER_STAGING_URL: ${{ vars.HYPERBET_BSC_KEEPER_STAGING_URL }}
      HYPERBET_BSC_KEEPER_STAGING_WS_URL: ${{ vars.HYPERBET_BSC_KEEPER_STAGING_WS_URL }}
      HYPERBET_BSC_STAGING_RPC_URL: ${{ vars.HYPERBET_BSC_STAGING_RPC_URL }}
      HYPERBET_BSC_STAGING_DUEL_ORACLE_ADDRESS: ${{ vars.HYPERBET_BSC_STAGING_DUEL_ORACLE_ADDRESS }}
      HYPERBET_BSC_STAGING_GOLD_CLOB_ADDRESS: ${{ vars.HYPERBET_BSC_STAGING_GOLD_CLOB_ADDRESS }}
      HYPERBET_BSC_STAGING_GOLD_AMM_ROUTER_ADDRESS: ${{ vars.HYPERBET_BSC_STAGING_GOLD_AMM_ROUTER_ADDRESS }}
      HYPERBET_BSC_STAGING_MUSD_TOKEN_ADDRESS: ${{ vars.HYPERBET_BSC_STAGING_MUSD_TOKEN_ADDRESS }}
      HYPERBET_BSC_STAGING_GOLD_TOKEN_ADDRESS: ${{ vars.HYPERBET_BSC_STAGING_GOLD_TOKEN_ADDRESS }}
      HYPERBET_BSC_STAGING_SKILL_ORACLE_ADDRESS: ${{ vars.HYPERBET_BSC_STAGING_SKILL_ORACLE_ADDRESS }}
      HYPERBET_BSC_STAGING_PERP_ENGINE_ADDRESS: ${{ vars.HYPERBET_BSC_STAGING_PERP_ENGINE_ADDRESS }}
      HYPERBET_BSC_STAGING_STREAM_PUBLISH_KEY: ${{ secrets.HYPERBET_BSC_STAGING_STREAM_PUBLISH_KEY }}
      HYPERBET_BSC_STAGING_REPORTER_PRIVATE_KEY: ${{ secrets.HYPERBET_BSC_STAGING_REPORTER_PRIVATE_KEY }}
      HYPERBET_BSC_STAGING_CANARY_PRIVATE_KEY: ${{ secrets.HYPERBET_BSC_STAGING_CANARY_PRIVATE_KEY }}
      HYPERBET_BSC_STAGING_ADMIN_PRIVATE_KEY: ${{ secrets.HYPERBET_BSC_STAGING_ADMIN_PRIVATE_KEY }}
      HYPERBET_BSC_STAGING_MARKET_OPERATOR_PRIVATE_KEY: ${{ secrets.HYPERBET_BSC_STAGING_MARKET_OPERATOR_PRIVATE_KEY }}
      HYPERBET_AVAX_PAGES_STAGING_URL: ${{ vars.HYPERBET_AVAX_PAGES_STAGING_URL }}
      HYPERBET_AVAX_KEEPER_STAGING_URL: ${{ vars.HYPERBET_AVAX_KEEPER_STAGING_URL }}
      HYPERBET_AVAX_KEEPER_STAGING_WS_URL: ${{ vars.HYPERBET_AVAX_KEEPER_STAGING_WS_URL }}
      HYPERBET_AVAX_STAGING_RPC_URL: ${{ vars.HYPERBET_AVAX_STAGING_RPC_URL }}
      HYPERBET_AVAX_STAGING_CHAIN_ID: ${{ vars.HYPERBET_AVAX_STAGING_CHAIN_ID }}
      HYPERBET_AVAX_STAGING_DUEL_ORACLE_ADDRESS: ${{ vars.HYPERBET_AVAX_STAGING_DUEL_ORACLE_ADDRESS }}
      HYPERBET_AVAX_STAGING_GOLD_CLOB_ADDRESS: ${{ vars.HYPERBET_AVAX_STAGING_GOLD_CLOB_ADDRESS }}
      HYPERBET_AVAX_STAGING_GOLD_AMM_ROUTER_ADDRESS: ${{ vars.HYPERBET_AVAX_STAGING_GOLD_AMM_ROUTER_ADDRESS }}
      HYPERBET_AVAX_STAGING_MUSD_TOKEN_ADDRESS: ${{ vars.HYPERBET_AVAX_STAGING_MUSD_TOKEN_ADDRESS }}
      HYPERBET_AVAX_STAGING_GOLD_TOKEN_ADDRESS: ${{ vars.HYPERBET_AVAX_STAGING_GOLD_TOKEN_ADDRESS }}
      HYPERBET_AVAX_STAGING_SKILL_ORACLE_ADDRESS: ${{ vars.HYPERBET_AVAX_STAGING_SKILL_ORACLE_ADDRESS }}
      HYPERBET_AVAX_STAGING_PERP_ENGINE_ADDRESS: ${{ vars.HYPERBET_AVAX_STAGING_PERP_ENGINE_ADDRESS }}
      HYPERBET_AVAX_STAGING_STREAM_PUBLISH_KEY: ${{ secrets.HYPERBET_AVAX_STAGING_STREAM_PUBLISH_KEY }}
      HYPERBET_AVAX_STAGING_REPORTER_PRIVATE_KEY: ${{ secrets.HYPERBET_AVAX_STAGING_REPORTER_PRIVATE_KEY }}
      HYPERBET_AVAX_STAGING_CANARY_PRIVATE_KEY: ${{ secrets.HYPERBET_AVAX_STAGING_CANARY_PRIVATE_KEY }}
      HYPERBET_AVAX_STAGING_ADMIN_PRIVATE_KEY: ${{ secrets.HYPERBET_AVAX_STAGING_ADMIN_PRIVATE_KEY }}
      HYPERBET_AVAX_STAGING_MARKET_OPERATOR_PRIVATE_KEY: ${{ secrets.HYPERBET_AVAX_STAGING_MARKET_OPERATOR_PRIVATE_KEY }}
      HYPERBET_AVAX_RAILWAY_STAGING_PROJECT_ID: ${{ vars.HYPERBET_AVAX_RAILWAY_STAGING_PROJECT_ID }}
      HYPERBET_AVAX_RAILWAY_STAGING_ENVIRONMENT_ID: ${{ vars.HYPERBET_AVAX_RAILWAY_STAGING_ENVIRONMENT_ID }}
      HYPERBET_AVAX_RAILWAY_STAGING_KEEPER_SERVICE_ID: ${{ vars.HYPERBET_AVAX_RAILWAY_STAGING_KEEPER_SERVICE_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Setup Hyperbet toolchain
        uses: ./.github/actions/setup-hyperbet
        with:
          install-foundry: "true"
          install-rust: "true"
          install-solana: "true"
          install-anchor: "true"

      - name: Install dependencies
        run: bash scripts/ci-install-verified.sh root

      - name: Run staged live proof
        run: node --import tsx scripts/staged-live-proof.ts --mode=${{ inputs.mode }} --target=${{ inputs.target }}

      - name: Upload staged proof artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: staged-live-proof
          path: .ci-artifacts/staged-live-proof
          if-no-files-found: ignore
