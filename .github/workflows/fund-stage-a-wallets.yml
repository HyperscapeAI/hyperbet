name: Fund Solana Devnet Launch Wallets

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Explicitly authorize Solana devnet funding"
        required: true
        default: DO_NOT_FUND
        type: choice
        options:
          - DO_NOT_FUND
          - FUND_SOLANA_DEVNET_WALLETS
      recipients:
        description: "Comma-separated Base58Address=SOLAmount pairs; maximum 10 SOL per recipient"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fund-solana-devnet-launch-wallets
  cancel-in-progress: false

jobs:
  fund-solana-devnet-wallets:
    name: Fund Solana devnet launch wallets
    if: ${{ inputs.confirmation == 'FUND_SOLANA_DEVNET_WALLETS' }}
    runs-on: ubuntu-latest
    environment: solana-devnet
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Setup Solana CLI
        uses: ./.github/actions/setup-hyperbet
        with:
          install-solana: "true"

      - name: Validate and fund recipients
        env:
          RECIPIENTS: ${{ inputs.recipients }}
          TESTNET_SOLANA_DEPLOYER_KEYPAIR: ${{ secrets.TESTNET_SOLANA_DEPLOYER_KEYPAIR }}
        run: |
          set -euo pipefail
          if [[ -z "$TESTNET_SOLANA_DEPLOYER_KEYPAIR" ]]; then
            echo "Missing TESTNET_SOLANA_DEPLOYER_KEYPAIR" >&2
            exit 1
          fi

          wallet_file="$(mktemp)"
          trap 'rm -f "$wallet_file"' EXIT
          printf '%s' "$TESTNET_SOLANA_DEPLOYER_KEYPAIR" >"$wallet_file"
          chmod 600 "$wallet_file"
          solana-keygen pubkey "$wallet_file" >/dev/null

          IFS=',' read -r -a targets <<<"$RECIPIENTS"
          if [[ "${#targets[@]}" -lt 1 || "${#targets[@]}" -gt 12 ]]; then
            echo "Provide between 1 and 12 recipients" >&2
            exit 1
          fi

          for target in "${targets[@]}"; do
            address="${target%%=*}"
            amount="${target#*=}"
            address="${address//[[:space:]]/}"
            amount="${amount//[[:space:]]/}"
            if [[ "$amount" == "$target" ]] || [[ ! "$address" =~ ^[1-9A-HJ-NP-Za-km-z]{32,44}$ ]]; then
              echo "Invalid recipient pair: $target" >&2
              exit 1
            fi
            if [[ ! "$amount" =~ ^(0|[1-9][0-9]*)(\.[0-9]{1,9})?$ ]]; then
              echo "Invalid SOL amount for $address" >&2
              exit 1
            fi
            awk -v amount="$amount" 'BEGIN { if (amount <= 0 || amount > 10) exit 1 }' || {
              echo "Amount for $address must be greater than 0 and at most 10 SOL" >&2
              exit 1
            }
          done

          for target in "${targets[@]}"; do
            address="${target%%=*}"
            amount="${target#*=}"
            address="${address//[[:space:]]/}"
            amount="${amount//[[:space:]]/}"
            solana transfer "$address" "$amount" \
              --url devnet \
              --keypair "$wallet_file" \
              --allow-unfunded-recipient
          done

          for target in "${targets[@]}"; do
            address="${target%%=*}"
            address="${address//[[:space:]]/}"
            solana balance "$address" --url devnet
          done
