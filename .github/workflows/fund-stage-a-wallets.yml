name: Fund Stage A Wallets

on:
  push:
    branches:
      - audit/develop-pm-hardening
    paths:
      - .github/workflows/fund-stage-a-wallets.yml
  workflow_dispatch:
    inputs:
      chain:
        description: "Target chain"
        required: true
        type: choice
        default: bsc
        options:
          - bsc
          - avax
          - solana
      recipients:
        description: "Comma-separated address=amount pairs. EVM example: 0xabc...=0.10ether. Solana example: Base58Pubkey=1.25 or Base58Pubkey=ALL"
        required: true
        type: string

jobs:
  fund-stage-a-wallets:
    name: Fund Stage A wallets
    runs-on: ubuntu-latest
    env:
      TARGET_CHAIN: ${{ github.event_name == 'workflow_dispatch' && inputs.chain || 'bsc' }}
      RECIPIENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.recipients || '0x4f2714dc431dc948B5B138Ef9b998e943568DE4d=0.20ether' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup funding toolchain
        uses: ./.github/actions/setup-hyperbet
        with:
          install-foundry: "true"
          install-solana: "true"

      - name: Resolve chain RPC
        env:
          BSC_TESTNET_RPC: ${{ secrets.BSC_TESTNET_RPC }}
          AVAX_FUJI_RPC: ${{ secrets.AVAX_FUJI_RPC }}
        run: |
          set -euo pipefail
          case "$TARGET_CHAIN" in
            bsc)
              echo "RPC=$BSC_TESTNET_RPC" >> "$GITHUB_ENV"
              ;;
            avax)
              echo "RPC=$AVAX_FUJI_RPC" >> "$GITHUB_ENV"
              ;;
            solana)
              echo "RPC=devnet" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported chain: $TARGET_CHAIN" >&2
              exit 1
              ;;
          esac

      - name: Fund recipients
        env:
          DEPLOYER_KEY: ${{ secrets.TESTNET_DEPLOYER_PRIVATE_KEY }}
          TESTNET_SOLANA_DEPLOYER_KEYPAIR: ${{ secrets.TESTNET_SOLANA_DEPLOYER_KEYPAIR }}
        run: |
          set -euo pipefail
          echo "Recipients: $RECIPIENTS"
          IFS=',' read -r -a TARGETS <<< "$RECIPIENTS"

          if [[ "$TARGET_CHAIN" == "solana" ]]; then
            if [[ -z "${TESTNET_SOLANA_DEPLOYER_KEYPAIR:-}" ]]; then
              echo "TESTNET_SOLANA_DEPLOYER_KEYPAIR is not available to this workflow" >&2
              exit 1
            fi

            wallet_file="$(mktemp)"
            trap 'rm -f "$wallet_file"' EXIT
            printf '%s' "$TESTNET_SOLANA_DEPLOYER_KEYPAIR" > "$wallet_file"
            chmod 600 "$wallet_file"
            deployer_address="$(solana-keygen pubkey "$wallet_file")"
            echo "Deployer address: $deployer_address"

            if [[ "${#TARGETS[@]}" -gt 1 ]]; then
              for target in "${TARGETS[@]}"; do
                value="${target#*=}"
                value="${value//[[:space:]]/}"
                if [[ "$value" == "ALL" ]]; then
                  echo "Solana ALL transfer supports exactly one recipient" >&2
                  exit 1
                fi
              done
            fi

            for target in "${TARGETS[@]}"; do
              address="${target%%=*}"
              value="${target#*=}"
              address="${address//[[:space:]]/}"
              value="${value//[[:space:]]/}"

              if [[ -z "$value" || "$value" == "$target" ]]; then
                echo "Invalid amount pair: $target" >&2
                exit 1
              fi

              echo "Sending $value SOL to $address on $TARGET_CHAIN"
              solana transfer \
                "$address" \
                "$value" \
                --url "$RPC" \
                --keypair "$wallet_file" \
                --allow-unfunded-recipient \
                --use-rpc
            done
            exit 0
          fi

          if [[ -z "${DEPLOYER_KEY:-}" ]]; then
            echo "TESTNET_DEPLOYER_PRIVATE_KEY is not available to this workflow" >&2
            exit 1
          fi

          DEPLOYER_ADDRESS="$(cast wallet address --private-key "$DEPLOYER_KEY")"
          echo "Deployer address: $DEPLOYER_ADDRESS"
          NONCE="$(cast nonce "$DEPLOYER_ADDRESS" --rpc-url "$RPC")"

          for i in "${!TARGETS[@]}"; do
            target="${TARGETS[$i]}"
            address="${target%%=*}"
            value="${target#*=}"
            address="${address//[[:space:]]/}"
            value="${value//[[:space:]]/}"

            if [[ ! "$address" =~ ^0x[a-fA-F0-9]{40}$ ]]; then
              echo "Invalid address: $address" >&2
              exit 1
            fi
            if [[ -z "$value" || "$value" == "$target" ]]; then
              echo "Invalid amount pair: $target" >&2
              exit 1
            fi

            current_nonce="$((NONCE + i))"
            echo "Sending $value to $address on $TARGET_CHAIN (nonce $current_nonce)"
            cast send "$address" \
              --value "$value" \
              --rpc-url "$RPC" \
              --private-key "$DEPLOYER_KEY" \
              --nonce "$current_nonce"
          done

      - name: Verify recipient balances
        run: |
          set -euo pipefail
          IFS=',' read -r -a TARGETS <<< "$RECIPIENTS"
          if [[ "$TARGET_CHAIN" == "solana" ]]; then
            for target in "${TARGETS[@]}"; do
              address="${target%%=*}"
              address="${address//[[:space:]]/}"
              echo "$address: $(solana balance "$address" --url "$RPC")"
            done
            exit 0
          fi

          for target in "${TARGETS[@]}"; do
            address="${target%%=*}"
            address="${address//[[:space:]]/}"
            echo "$address: $(cast balance "$address" --rpc-url "$RPC" --ether)"
          done
